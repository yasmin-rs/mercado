[project]
name = "mercado"
version = "0.1.0"
description = "Assistente de compras de mercado a partir de notas fiscais (NFC-e) — portfólio AI Builder"
readme = "README.md"
authors = [
    { name = "yasmin-rs", email = "yasmin.r@aluno.ufabc.edu.br" }
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "litellm==1.108.2",
    "opencv-contrib-python-headless>=5.0.0.93",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
    "zxing-cpp>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
