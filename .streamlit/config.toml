[theme]
base = "light"
primaryColor = "#b3124f"              # botões, seletores e aba selecionada (rosa do cabeçalho)
backgroundColor = "#fdf2f6"           # fundo da página: rosa bem claro
secondaryBackgroundColor = "#ffffff"  # caixas, campos e expanders
textColor = "#1b1b1a"

[browser]
gatherUsageStats = false
